<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Servisi yalnizca root calistirabilir -->
  <policy user="root">
    <allow own="io.github.fatih5228.LegionFanControl"/>
    <allow send_destination="io.github.fatih5228.LegionFanControl"/>
  </policy>

  <!-- Yonetici (wheel) kullanicilari fanlari ve kilitleri degistirebilir -->
  <policy group="wheel">
    <allow send_destination="io.github.fatih5228.LegionFanControl"/>
  </policy>

  <!-- Diger kullanicilar yalnizca durumu okuyabilir -->
  <policy context="default">
    <allow send_destination="io.github.fatih5228.LegionFanControl"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.fatih5228.LegionFanControl"
           send_interface="io.github.fatih5228.LegionFanControl" send_member="GetState"/>
    <allow send_destination="io.github.fatih5228.LegionFanControl"
           send_interface="io.github.fatih5228.LegionFanControl" send_member="GetHardwareInfo"/>
  </policy>
</busconfig>
